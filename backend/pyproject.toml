[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronotwin-backend"
version = "0.1.0"
description = "ChronoTwin - multi-agent AI operating layer for a city digital twin"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "redis>=5.0",
    "aiokafka>=0.10",
    "networkx>=3.3",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
agents = [
    "google-adk>=1.0",
    "litellm>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
